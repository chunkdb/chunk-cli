name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Format check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Select server branch
        id: server-branch
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ "$branch" = "feat/commit-core" ]; then
            printf 'ref=%s\n' 'ef2e5ad301b6cf5797601599e69159ee7698bf14' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$branch" = "feat/chunk-model" ]; then
            printf 'ref=%s\n' '4842a36e3809c88331fa4a6e42c46775e53770e1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref=main
          if refs=$(git ls-remote --exit-code --heads https://github.com/chunkdb/chunkdb.git "refs/heads/$branch"); then
            while IFS=$'\t' read -r oid remote_ref; do
              if [ "$remote_ref" = "refs/heads/$branch" ]; then
                ref="$branch"
                break
              fi
            done <<< "$refs"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout server
        uses: actions/checkout@v5
        with:
          repository: chunkdb/chunkdb
          ref: ${{ steps.server-branch.outputs.ref }}
          path: chunkdb-server

      - name: Install OpenSSL
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install openssl@3
            echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y libssl-dev openssl
          fi

      - name: Build server with TLS
        run: |
          cmake -S chunkdb-server -B chunkdb-server/build \
            -DCMAKE_BUILD_TYPE=Release -DCHUNKDB_WERROR=ON \
            -DCHUNKDB_BUILD_TESTS=OFF -DCHUNKDB_WITH_TLS=ON
          cmake --build chunkdb-server/build --parallel 3 --target chunkdb_server

      - name: Run all tests and integrations
        shell: bash
        env:
          CHUNKDB_SERVER_BIN: ${{ github.workspace }}/chunkdb-server/build/chunkdb_server
          CHUNKDB_REQUIRE_SERVER: '1'
        run: |
          test -x "$CHUNKDB_SERVER_BIN"
          set -o pipefail
          go test -race -count=1 -timeout=10m -json ./... | tee test-results.jsonl
          go run ./internal/ci/testresults test-results.jsonl TestCLIDocExamples,TestCLIWorldExample,TestCLIConnection,TestCLIBackupStatement,TestCLIWatchTLS
