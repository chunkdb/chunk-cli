name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Format check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Checkout server
        uses: actions/checkout@v5
        with:
          repository: chunkdb/chunkdb
          path: chunkdb-server

      - name: Build example server
        run: |
          cmake -S chunkdb-server -B chunkdb-server/build -DCMAKE_BUILD_TYPE=Release -DCHUNKDB_WERROR=ON
          cmake --build chunkdb-server/build --parallel 3 --target chunkdb_server

      - name: Run world example test
        env:
          CHUNKDB_SERVER_BIN: ${{ github.workspace }}/chunkdb-server/build/chunkdb_server
        run: go test ./cmd/chunk-cli -run '^TestCLIWorldExample$' -count=1
